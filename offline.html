<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Brak połączenia</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#172744,#070b14 62%);color:#f8fafc;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(520px,100%);padding:32px;border:1px solid rgba(148,163,184,.22);border-radius:28px;background:rgba(12,19,33,.94);box-shadow:0 28px 90px rgba(0,0,0,.45);text-align:center}.icon{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:rgba(96,165,250,.14);color:#60a5fa;font-size:30px}h1{margin:0;font-size:30px}p{color:#b8c2d4}button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:14px;background:#60a5fa;color:#06101d;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">⌁</div>
    <h1>Brak połączenia z serwerem</h1>
    <p>Nie zapisujemy zmian bez internetu, żeby nie nadpisać nowszych danych innych osób. Połącz się z siecią i spróbuj ponownie.</p>
    <button type="button" onclick="location.reload()">Sprawdź ponownie</button>
  </main>
</body>
</html>
